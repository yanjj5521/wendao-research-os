{% extends 'base.html' %}{% block content %}<div class="page-title"><div><h1>版本中心</h1></div></div><section class="release-list">{% for r in releases %}<article class="panel release"><div><span>v{{ r.version }}</span><h2>{{ r.title }}</h2><small>{{ r.created_at[:16].replace('T',' ') }} · {{ '%.1f'|format(r.file_size/1024/1024) }} MB</small></div><p>{{ r.notes }}</p><code>SHA256 {{ r.sha256 }}</code><a class="primary" href="{{ url_for('hub_release_download', release_id=r.id) }}">下载版本包</a></article>{% else %}<div class="panel empty">管理员尚未发布版本包。</div>{% endfor %}</section>{% endblock %}
