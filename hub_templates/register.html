{% extends 'base.html' %}{% block content %}
<section class="narrow">
  <div class="panel">
    <div class="section-head"><div><h1>加入同行会</h1></div></div>
    <p class="form-help">管理员账号无需注册。</p>
    {% if user %}<p class="form-help" style="color:#b3543c;font-weight:700">当前已登录 {{ user.display_name }}（{{ '管理员' if user.role=='admin' else '成员' }}）。提交后会创建新账号并加入右上角账号切换列表，<b>当前账号不会退出</b>。</p>{% endif %}
    <form class="form-grid" method="post" action="{{ url_for('hub_register_submit') }}">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>邀请码<small>可粘贴注册链接</small><input name="invite" value="{{ invite }}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="邀请码或注册链接" required></label>
      <label>用户名<input name="username" value="{{ username_draft }}" autocomplete="username" placeholder="英文、数字、下划线" required></label>
      <label>显示名称<input name="display_name" value="{{ display_draft }}" autocomplete="nickname" placeholder="朋友看到的名字" required></label>
      <label>邮箱（可选）<small>可留空，不填也能注册</small><input name="email" type="email" value="{{ email_draft }}" autocomplete="email" placeholder="可留空，例如 you@example.com"></label>
      <label>密码<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>确认密码<input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required></label>
      <button class="primary">创建账户</button><button type="button" id="clearDraft" class="button">清空草稿</button>
      <a class="button" href="{{ url_for('hub_home') }}">返回登录</a>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ media_base }}/static/register.js" defer></script>{% endblock %}
