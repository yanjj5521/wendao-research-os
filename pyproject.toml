[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wendao-research-v3"
version = "1.12.9"
description = "问道科研 1.12.9：体积压缩（去 PyMuPDF/openpyxl）、导航整合与文案精简"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "bleach>=6.2,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "Pillow>=11,<13",
  "pywebview>=5.4,<6",
]

[tool.setuptools]
py-modules = [
  "desktop_pet", "desktop_shell", "run_hub", "run_local",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "features*", "hub*", "launchers*", "services*", "web*"]

[tool.setuptools.data-files]
"share/wendao-research" = ["VERSION"]
"share/wendao-research/templates" = ["templates/*.html"]
"share/wendao-research/static" = [
  "static/*.css", "static/*.js", "static/*.png", "static/*.svg",
]
"share/wendao-research/static/pet" = ["static/pet/*"]
"share/wendao-research/static/wallpapers" = ["static/wallpapers/*"]
"share/wendao-research/static/art" = ["static/art/*"]
"share/wendao-research/hub_templates" = ["hub_templates/*.html"]
"share/wendao-research/hub_static" = ["hub_static/*"]
"share/wendao-research/assets" = ["assets/*"]
"share/wendao-research/packaging/windows" = ["packaging/windows/*"]
"share/wendao-research/native/headnet" = ["native/headnet/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
